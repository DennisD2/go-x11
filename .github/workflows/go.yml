name: Go build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'

      - name: Install system dependencies
        run: |
          set -e
          sudo apt-get update
          # Install development libraries required for X11/Motif linking
          sudo apt-get install -y --no-install-recommends build-essential libx11-dev libxext-devel libxt-dev libmotif-dev

      - name: Cache Go build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Build
        env:
          CGO_ENABLED: '1'
        run: |
          go version
          go env
          go build -v ./...

      - name: Run tests
        if: success()
        env:
          CGO_ENABLED: '1'
        run: |
          go test -v ./...
